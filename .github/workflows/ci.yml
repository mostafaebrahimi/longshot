name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pack both stores
        run: node tools/build.mjs --target=all

      - name: Lint the Firefox package
        run: npx --yes web-ext@10 lint --source-dir dist/package-firefox

      # Branded Chrome refuses --load-extension, so the smoke test needs a
      # Chrome for Testing build. The install prints "chrome@<version> <path>".
      - name: Install Chrome for Testing
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers" \
            | tee "$RUNNER_TEMP/chrome.txt"
          echo "CHROME_BIN=$(tail -n1 "$RUNNER_TEMP/chrome.txt" | cut -d' ' -f2)" >> "$GITHUB_ENV"

      # The smoke test proves the PDF export by parsing it with an outside reader.
      - name: Install poppler-utils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Capture a fixture page and check the stitched result
        # The runner image forbids unprivileged user namespaces, so Chrome's
        # own sandbox cannot start. The job is already the isolation boundary.
        env:
          CHROME_EXTRA_FLAGS: --no-sandbox
        run: node tools/smoke-test.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error
