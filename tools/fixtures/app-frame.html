<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>App shell — frame around the panel</title>
    <!-- Nothing on this page is pure white: any white pixel in a capture of it
         is canvas that was never painted. Colours are flat so the smoke test can
         name the piece of furniture it is looking at. -->
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; font: 15px system-ui, sans-serif; }
      body { background: #f6f7fb; }

      .sidebar {
        position: fixed; inset-block: 0; inset-inline-start: 0; width: 230px;
        background: #e0e7ff; padding: 16px; color: #3730a3;
      }
      .sidebar a { display: block; padding: 9px 4px; }
      /* Deliberately parked across the line where the first screen ends, so the
         bottom row of the sidebar is not a flat one. A capture has to look
         further up the column for a row worth repeating — which is what the
         real thing does, and what the readback count in the smoke test is
         there to keep honest. */
      .sidebar .foot { position: absolute; inset-block-end: 45px; font-size: 12px; }

      .topbar {
        position: fixed; inset-block-start: 0; inset-inline-start: 230px; inset-inline-end: 0;
        height: 56px; background: #fef3c7; display: flex; align-items: center; padding: 0 20px;
        font-weight: 700; color: #92400e;
      }
      .footer {
        position: fixed; inset-block-end: 0; inset-inline-start: 230px; inset-inline-end: 0;
        height: 52px; background: #d1fae5; display: flex; align-items: center; padding: 0 20px;
        font-size: 12px; color: #065f46;
      }

      /* Sits between the two bars, so there is furniture above it and below it
         as well as beside it. Scrolls smoothly, like the app shells that break
         naive capture tools. */
      .main {
        position: fixed; inset-block-start: 56px; inset-block-end: 52px;
        inset-inline-start: 230px; inset-inline-end: 0;
        overflow-y: auto; scroll-behavior: smooth; padding: 20px;
      }

      .row {
        height: 230px; margin-bottom: 16px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font: 700 56px/1 system-ui; color: #111827;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <a>داشبورد</a><a>طرف حساب ها</a><a>محصولات</a><a>فاکتورها</a>
      <div class="foot">© همه حقوق محفوظ است</div>
    </aside>
    <header class="topbar">داشبورد</header>
    <main class="main" id="panel">
      <div class="row" style="background:#fee2e2">۱</div>
      <div class="row" style="background:#ffedd5">۲</div>
      <div class="row" style="background:#dcfce7">۳</div>
      <div class="row" style="background:#0f766e; color:#f8fafc">۴</div>
    </main>
    <footer class="footer">نسخه ۰.۰.۱</footer>
  </body>
</html>
