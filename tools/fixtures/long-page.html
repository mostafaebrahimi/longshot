<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Longshot test page</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
      header {
        position: sticky; top: 0; height: 60px; background: #ff00ff; color: #fff;
        display: flex; align-items: center; padding: 0 20px; font-weight: 700;
      }
      .band { height: 900px; display: flex; align-items: center; justify-content: center;
        font-size: 64px; font-weight: 800; color: rgba(255,255,255,.85); }
      .fixed-badge {
        position: fixed; right: 20px; bottom: 20px; background: #00ffff; color: #000;
        padding: 10px 14px; border-radius: 8px; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <header>Sticky header</header>
    <!-- Six 900px bands of known colour; the smoke test samples each one. -->
    <div class="band" style="background:#e11d48">1</div>
    <div class="band" style="background:#f59e0b">2</div>
    <div class="band" style="background:#16a34a">3</div>
    <div class="band" style="background:#0ea5e9">4</div>
    <div class="band" style="background:#7c3aed">5</div>
    <div class="band" style="background:#111827">6</div>
    <div class="fixed-badge">Fixed badge</div>
  </body>
</html>
